<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistrationForm</title>
</head>
<body style="margin: 0;">
    <div style="background-color: burlywood;">
        <header align="center" style="padding: 20px;">
            <h1>Student Registration Form</h1>
        </header>
    </div>
    <div style="background-color: darkseagreen; gap: 40px; padding: 10px; display:flex; justify-content:center">
        <a href="Home.html">Home</a>
        <a href="RegistrationForm.html">Registration Form</a>
        <a href="GradeTable.html">Grade Table</a>
        <a href="MyProfile.html">My Profile</a>

    </div>
<Form>
    Student Name:
    <br> 
    <input type="text" name="studname"/>
    <br>
    Student Number:
    <br>
    <input type="number" name="studnum"/>
    <br>
    Email:
    <br> 
    <input type="email" name="email"/>
    <br>
    Gender:
    <br> 
    <input type="radio" name="male" value="on"/>Male
    <input type="radio" name="female" value="on"/>Female
    <br>
    Course:
    <br> 
    <select name="dropdown">
        <option value="BSIT">BSIT</option>
        <option value="BSCS">BSCS</option>
    </select>
    <br>
    Skills:
    <br> 
    <input type="checkbox" name="HTML" value="on">HTML
    <input type="checkbox" name="CSS" value="on">CSS
    <input type="checkbox" name="JAVA" value="on">JAVASCRIPT
    <br>
    <input type="file" name="fileupload" accept="image/*" />
    <br>
    <input type="submit" name="submit" value="Submit" />
    <input type="reset" name="reset"  value="Reset" />
    
    


</Form>

</body>
</html>
